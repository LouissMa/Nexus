[project]
name = "nexus-lifeagent"
version = "0.1.0"
description = "A proactive personal AI assistant with long-term memory, multi-agent planning, permissioned tools, and MCP."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Bingnan Ma" }
]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
rag = [
  "qdrant-client[fastembed]>=1.14.2,<2",
]
tools = [
  "icalendar>=6,<7",
  "recurring-ical-events>=3.8,<4",
]
mcp = [
  "mcp>=1.27,<2",
]
research = [
  "pypdf>=5,<7",
]
voice = [
  "sounddevice>=0.5,<1",
  "faster-whisper>=1.1,<2",
]

[project.scripts]
nexus = "nexus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]
